[package]
name = "thronium-engine"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits", "hooks"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
sha2 = "0.10.9"
# Already in the tree through rustls; used directly for the sealed library.
ring = "=0.17.14"
hmac = "=0.12.1"
sha1 = "=0.10.6"
libc = "0.2"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "=0.18.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_System_Registry", "Win32_Foundation", "Win32_Networking_WinInet", "Win32_NetworkManagement_Rras", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Com", "Win32_System_Services", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Credentials"] }

[features]
# Set only for this crate's own tests (see dev-dependencies): the library they
# link never reaches the desktop's key store, as its unit tests already don't.
isolated-keyring = []

[dev-dependencies]
thronium-engine = { path = ".", features = ["isolated-keyring"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[[bin]]
name = "engine-smoke"
path = "src/bin/smoke.rs"
